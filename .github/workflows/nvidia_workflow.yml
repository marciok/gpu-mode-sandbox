name: NVIDIA PyTorch/CUDA Job
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique identifier for this run'
        required: true
        type: string
      payload:
        description: 'Content of the user submission, as json string'
        required: true
        type: string
      requirements:
        description: 'Contents for a requirements.txt file'
        required: false
        type: string

run-name: 'NVIDIA Job - ${{ github.event.inputs.run_id }}'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Print submission
        run: |
          echo "Run ID: ${{ inputs.run_id }}"
          echo "Payload received (masked)"

      - name: Simulate benchmark
        run: |
          mkdir -p profile_data
          python3 - <<'PY'
          import json, random

          def mock_run(name):
              return {
                  "command": f"python3 eval.py --mode {name}",
                  "stdout": f"{name} ok",
                  "stderr": "",
                  "success": True,
                  "passed": True,
                  "exit_code": 0,
                  "duration": round(random.uniform(0.5, 5.0), 3),
                  "result": {
                      "score": round(random.uniform(0.1, 2.0), 4),
                      "runtime_ms": round(random.uniform(1, 20), 3),
                  },
              }

          result = {
              "runs": {
                  "test": mock_run("test"),
                  "benchmark": mock_run("benchmark"),
              },
              "compilation": {"success": True, "stdout": "", "stderr": ""},
              "system": {"gpu": "mock-B200", "runner": "ubuntu-latest"},
          }
          print(json.dumps(result, indent=2))
          open("result.json", "w").write(json.dumps(result))
          open("profile_data/profile.json", "w").write(json.dumps({"trace": "mock"}))
          PY

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-result
          path: result.json

      - name: Upload profiling artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-data
          path: profile_data/*
          retention-days: 1
