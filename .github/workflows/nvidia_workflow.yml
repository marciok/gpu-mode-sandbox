name: NVIDIA PyTorch/CUDA Job
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique identifier for this run'
        required: true
        type: string
      payload:
        description: 'Content of the user submission, as json string'
        required: true
        type: string
      requirements:
        description: 'Contents for a requirements.txt file'
        required: false
        type: string

run-name: 'NVIDIA Job - ${{ github.event.inputs.run_id }}'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Print submission
        run: |
          echo "Run ID: ${{ inputs.run_id }}"
          echo "Payload received (masked)"

      - name: Simulate benchmark
        run: |
          mkdir -p profile_data
          python3 - <<'PY'
          import json, random, time
          from datetime import datetime, timezone

          def iso(ts):
              return datetime.fromtimestamp(ts, tz=timezone.utc).isoformat()

          def run_result(name, result_payload):
              duration = round(random.uniform(0.5, 5.0), 3)
              return {
                  "success": True,
                  "passed": True,
                  "command": f"python3 eval.py --mode {name}",
                  "stdout": f"{name} ok",
                  "stderr": "",
                  "exit_code": 0,
                  "duration": duration,
                  "result": result_payload,
              }

          def eval_result(run):
              now = time.time()
              return {
                  "start": iso(now),
                  "end": iso(now + run["duration"]),
                  "compilation": None,
                  "run": run,
                  "profile": None,
              }

          test_result = {
              "test-count": 1,
              "test.0.status": "pass",
              "test.0.spec": "mock test",
          }
          bench_payload = {
              "benchmark-count": 1,
              "benchmark.0.status": "pass",
              "benchmark.0.spec": "mock benchmark",
              "benchmark.0.mean": int(random.uniform(1_000_000, 20_000_000)),
              "benchmark.0.err": int(random.uniform(1_000, 100_000)),
              "benchmark.0.best": int(random.uniform(900_000, 1_000_000)),
              "benchmark.0.worst": int(random.uniform(20_000_000, 25_000_000)),
          }

          result = {
              "success": True,
              "error": "",
              "system": {
                  "gpu": "mock-B200",
                  "device_count": 1,
                  "cpu": "mock-cpu",
                  "runtime": "CUDA",
                  "platform": "Linux",
                  "torch": "2.4.0",
                  "hostname": "mock-runner",
              },
              "runs": {
                  "test": eval_result(run_result("test", test_result)),
                  "benchmark": eval_result(run_result("benchmark", bench_payload)),
                  "leaderboard": eval_result(run_result("leaderboard", bench_payload)),
              },
          }
          print(json.dumps(result, indent=2))
          open("result.json", "w").write(json.dumps(result))
          open("profile_data/profile.json", "w").write(json.dumps({"trace": "mock"}))
          PY

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-result
          path: result.json

      - name: Upload profiling artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-data
          path: profile_data/*
          retention-days: 1
